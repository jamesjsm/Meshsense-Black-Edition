name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft release after all builds pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libdbus-1-dev dbus bluez libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libfuse2t64 xvfb
      - name: Check populated dependency sources
        run: python ci-package.py check
      - name: Build application and source
        run: node build-custom.mjs --install
      - name: Check packaged service
        if: runner.os != 'Linux'
        run: node smoke-test.mjs
      - name: Check Linux packaged service under virtual display
        if: runner.os == 'Linux'
        env:
          MESHSENSE_CI_NO_SANDBOX: '1'
        run: dbus-run-session -- xvfb-run --auto-servernum node smoke-test.mjs
      - name: Prepare release files
        run: python ci-package.py package ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release/ci/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    if: inputs.draft_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          gh release create "v$VERSION" artifacts/* --draft --prerelease --target "$GITHUB_SHA" --title "Meshsense Black Edition $VERSION" --notes-file RELEASE-NOTES.md
