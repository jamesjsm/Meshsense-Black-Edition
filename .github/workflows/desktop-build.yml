name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Windows x64
        type: boolean
        default: true
      mac_arm:
        description: macOS Apple Silicon
        type: boolean
        default: true
      mac_intel:
        description: macOS Intel
        type: boolean
        default: true
      linux:
        description: Linux x64 desktop (including Mint)
        type: boolean
        default: true
      pi:
        description: Raspberry Pi ARM64 headless
        type: boolean
        default: true
      draft_release:
        description: Create a draft release after all selected builds pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  select-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      desktop: ${{ steps.select.outputs.desktop }}
    steps:
      - name: Select requested platforms
        id: select
        env:
          BUILD_WINDOWS: ${{ inputs.windows }}
          BUILD_MAC_ARM: ${{ inputs.mac_arm }}
          BUILD_MAC_INTEL: ${{ inputs.mac_intel }}
          BUILD_LINUX: ${{ inputs.linux }}
          BUILD_PI: ${{ inputs.pi }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const choices = [
            ['BUILD_WINDOWS', 'windows-latest', 'windows-x64'],
            ['BUILD_MAC_ARM', 'macos-15', 'macos-arm64'],
            ['BUILD_MAC_INTEL', 'macos-15-intel', 'macos-x64'],
            ['BUILD_LINUX', 'ubuntu-24.04', 'linux-x64'],
          ];
          const include = choices.filter(([key]) => process.env[key] === 'true')
            .map(([, runner, platform]) => ({ runner, platform }));
          if (!include.length && process.env.BUILD_PI !== 'true') {
            console.error('Select at least one platform before starting the workflow.');
            process.exit(1);
          }
          const desktop = include.length > 0;
          // Keep a valid matrix when the desktop job is skipped for a Pi-only run.
          const matrix = { include: desktop ? include : [{runner: 'ubuntu-latest', platform: 'unused'}] };
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `desktop=${desktop}\nmatrix=${JSON.stringify(matrix)}\n`);
          NODE

  build:
    needs: select-platforms
    if: needs.select-platforms.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libdbus-1-dev dbus bluez libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libfuse2t64 xvfb
      - name: Check populated dependency sources
        run: python ci-package.py check
      - name: Build application and source
        run: node build-custom.mjs --install
      - name: Check packaged service
        if: runner.os != 'Linux'
        run: node smoke-test.mjs
      - name: Check Linux packaged service under virtual display
        if: runner.os == 'Linux'
        env:
          MESHSENSE_CI_NO_SANDBOX: '1'
        run: dbus-run-session -- xvfb-run --auto-servernum node smoke-test.mjs
      - name: Prepare release files
        run: python ci-package.py package ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release/ci/*
          if-no-files-found: error
          retention-days: 30

  pi-headless:
    needs: select-platforms
    if: inputs.pi
    runs-on: ubuntu-24.04-arm
    container: node:24-bookworm
    timeout-minutes: 60
    env:
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y python3 cmake pkg-config libdbus-1-dev
          npm install --global pnpm@11.19.0
      - name: Check source
        run: python3 ci-package.py check
      - name: Build native Pi service and source
        run: node build-custom.mjs --install --headless-package
      - name: Test extracted Pi package without a desktop
        run: node pi-smoke-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-pi-arm64-headless
          path: release/pi/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    if: >-
      always() && !cancelled() && inputs.draft_release &&
      needs.select-platforms.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.pi-headless.result == 'success' || needs.pi-headless.result == 'skipped')
    needs: [select-platforms, build, pi-headless]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          gh release create "v$VERSION" artifacts/* --draft --prerelease --target "$GITHUB_SHA" --title "Meshsense Black Edition $VERSION" --notes-file RELEASE-NOTES.md
